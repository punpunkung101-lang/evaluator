<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="index_page_title">ระบบประเมินประสิทธิภาพและประสิทธิผลของระบบ IT | คณะสหเวชศาสตร์ มหาวิทยาลัยนเรศวร</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS: Common Master Stylesheet & Page Styles -->
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/pages/evaluation.css">
</head>
<body>

    <main class="container">
        <header class="evaluation-header">
            <h1 data-i18n="app_title">IT Evaluator</h1>
            <p class="subtitle" data-i18n="app_subtitle">ระบบประเมินประสิทธิภาพและประสิทธิผลของระบบเทคโนโลยีสารสนเทศ</p>
            <p class="institution" data-i18n="institution">คณะสหเวชศาสตร์ มหาวิทยาลัยนเรศวร</p>
        </header>

        <!-- ข้อมูลผู้ประเมินและการเลือกระบบสารสนเทศ -->
        <section class="form-section profile-card" id="profile-section">
            <h2 data-i18n="evaluator_profile_title">ข้อมูลผู้ประเมิน</h2>
            <p class="section-desc" data-i18n="evaluator_profile_desc">โปรดระบุข้อมูลเบื้องต้นเพื่อใช้ประกอบการวิเคราะห์ทางสถิติของหน่วยงาน</p>

            <div class="form-group">
                <label class="form-label" for="evaluator-name" data-i18n="evaluator_name_label">ชื่อ-นามสกุล หรือ รหัสผู้ใช้งาน</label>
                <input
                    type="text"
                    id="evaluator-name"
                    class="form-control"
                    data-i18n-placeholder="evaluator_name_placeholder"
                    placeholder="กรอกชื่อ-นามสกุล หรือนามสมมุติ"
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="user-role" data-i18n="evaluator_role_label">ประเภทบุคลากร / ผู้ใช้งาน</label>
                <select id="user-role" class="form-control">
                    <option value="" data-i18n="role_select_prompt">-- โปรดเลือกประเภทผู้ใช้งาน --</option>
                    <option value="student" data-i18n="role_student">นิสิต</option>
                    <option value="teacher" data-i18n="role_teacher">อาจารย์ / นักวิจัย</option>
                    <option value="staff" data-i18n="role_staff">บุคลากรสายสนับสนุน</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="system-select" data-i18n="evaluator_system_label">ระบบสารสนเทศที่ต้องการประเมิน</label>
                <select id="system-select" class="form-control">
                    <option value="" data-i18n="system_select_prompt">-- โปรดเลือกระบบสารสนเทศที่ต้องการประเมิน --</option>
                    <option value="SYS001">SYS001 - รายชื่อบุคลากร</option>
                    <option value="SYS002">SYS002 - ระบบลาออนไลน์</option>
                    <option value="SYS003">SYS003 - ลงเวลาปฏิบัติงาน</option>
                    <option value="SYS004">SYS004 - ฐานข้อมูลงานวิจัย</option>
                    <option value="SYS005">SYS005 - คุณสมบัติอาจารย์ผู้รับผิดชอบหลักสูตร</option>
                    <option value="SYS006">SYS006 - AHS KM Hub</option>
                    <option value="SYS007">SYS007 - ภาระงานสายวิชาการ</option>
                    <option value="SYS008">SYS008 - ภาระงานสายสนับสนุน</option>
                    <option value="SYS009">SYS009 - แผนปฏิบัติการประจำปี</option>
                    <option value="SYS010">SYS010 - ระบบ KPI / แผนกลยุทธ์</option>
                    <option value="SYS011">SYS011 - ระบบรับส่งหนังสือ</option>
                    <option value="SYS012">SYS012 - กรรมการภายในต่างๆ</option>
                    <option value="SYS013">SYS013 - ระบบเสนอของบอิเล็กทรอนิกส์</option>
                    <option value="SYS014">SYS014 - AHS eForm</option>
                    <option value="SYS015">SYS015 - ดาวน์โหลดแบบฟอร์ม</option>
                    <option value="SYS016">SYS016 - ระบบบริหารจัดการอาคารและห้อง</option>
                    <option value="SYS017">SYS017 - ระบบบริหารจัดการครุภัณฑ์</option>
                    <option value="SYS018">SYS018 - ระบบซ่อมและบำรุงรักษา</option>
                    <option value="SYS019">SYS019 - ระบบขอรับบริการจากหน่วยประชาสัมพันธ์</option>
                    <option value="SYS020">SYS020 - ระบบลูกหนี้เงินยืม</option>
                    <option value="SYS021">SYS021 - ระบบ AHS e-donation</option>
                </select>
            </div>

            <button id="start-btn" class="btn btn-primary" type="button">
                <span data-i18n="evaluator_start_btn">เริ่มต้นการประเมิน</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42 5.43 5.43H5v2z"/></svg>
            </button>
        </section>

        <footer class="site-footer" data-i18n="footer_text">
            ระบบประเมินประสิทธิภาพ IT © 2026 | คณะสหเวชศาสตร์ มหาวิทยาลัยนเรศวร
        </footer>
    </main>

    <!-- JS: Shared Systems Data & Theme/Lang Logic -->
    <script src="../assets/js/shared/systems-data.js"></script>
    <script src="../assets/js/shared/theme-lang.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const systemSelect = document.getElementById("system-select");
            const startBtn = document.getElementById("start-btn");
            const evaluatorNameInput = document.getElementById("evaluator-name");
            const userRoleSelect = document.getElementById("user-role");

            // Populate system options from shared data
            function populateSystems() {
                if (!systemSelect) return;
                const currentVal = systemSelect.value;
                const sysList = window.AssessmentCatalog ? window.AssessmentCatalog.getSystems() : (window.systems || []);
                const promptText = window.ThemeLang && window.ThemeLang.t ? window.ThemeLang.t("system_select_prompt") : "-- โปรดเลือกระบบสารสนเทศที่ต้องการประเมิน --";

                systemSelect.innerHTML = `<option value="">${promptText}</option>`;
                sysList.forEach(sys => {
                    const option = document.createElement("option");
                    option.value = sys.id;
                    const sysName = window.getSystemName ? window.getSystemName(sys) : sys.name;
                    option.textContent = `${sys.id} - ${sysName}`;
                    systemSelect.appendChild(option);
                });

                if (currentVal) {
                    systemSelect.value = currentVal;
                }
            }

            populateSystems();

            // Language switch event
            document.addEventListener("langchange", () => {
                populateSystems();
            });

            // Start Assessment
            if (startBtn) {
                startBtn.addEventListener("click", () => {
                    const evaluatorName = (evaluatorNameInput.value || "").trim();
                    const userRole = userRoleSelect.value;
                    const selectedSystem = systemSelect.value;

                    if (!userRole) {
                        alert(window.ThemeLang && window.ThemeLang.t ? window.ThemeLang.t("evaluator_role_required") : "กรุณาเลือกประเภทผู้ใช้งาน");
                        userRoleSelect.focus();
                        return;
                    }

                    if (!selectedSystem) {
                        alert(window.ThemeLang && window.ThemeLang.t ? window.ThemeLang.t("system_required") : "กรุณาเลือกระบบสารสนเทศที่ต้องการประเมิน");
                        systemSelect.focus();
                        return;
                    }

                    const defaultName = window.ThemeLang && window.ThemeLang.t ? window.ThemeLang.t("anonymous_evaluator") : "ผู้ใช้งานไม่ประสงค์ออกนาม";
                    sessionStorage.setItem("evaluatorProfile", JSON.stringify({
                        name: evaluatorName || defaultName,
                        role: userRole
                    }));

                    window.location.href = `evaluation.html?system=${encodeURIComponent(selectedSystem)}`;
                });
            }
        });
    </script>
</body>
</html>
